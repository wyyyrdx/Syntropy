version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
      - ./backend/data:/usr/src/app/data
    environment:
      - PORT=3000
      - DB_PATH=/usr/src/app/data/syntropy.db
      - UPLOAD_DIR=/usr/src/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_URL=http://ai-service:8000/generate
      - AI_SERVICE_TIMEOUT_MS=120000
    depends_on:
      - ai-service

  ai-service:
    build: ./ai-models
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
